aid: 9am-health
name: 9am Health
description: >-
  9amHealth (join9am.com) is a US virtual cardiometabolic clinic delivering
  specialized care for type 2 diabetes, obesity/weight loss, high blood
  pressure, and high cholesterol entirely from home. Founded in 2021 in San
  Diego by mySugr co-founders Frank Westermann and Anton Kittelberger, the
  company pairs at-home lab test kits, asynchronous and synchronous telehealth
  visits with obesity specialists, pharmacists, dietitians, and behavioral
  health experts, mail-order pharmacy for prescriptions including GLP-1 receptor
  agonists, and optional connected devices such as continuous glucose monitors
  into individualized care plans. It sells direct to individuals and through
  employers, health plans, and pharmacy benefit managers. 9amHealth is a
  consumer and enterprise telehealth brand and does not publish a public
  developer API, SDK, or documentation program; this profile captures its
  public web identity for the API Evangelist network. Backed by Speedinvest.
